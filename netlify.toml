# Netlify deployment for the Conserje backend.
#
# This site serves no pages: it is the API the widget talks to. The landing
# page is a separate deploy -- keeping them apart is what lets one backend
# serve several tenants from `sites/`.
#
# The base stays at the repository root rather than `server/`, because
# `included_files` cannot reach outside the base and the site configs live one
# level above. That is why every path below is repo-relative and the build
# command installs with --prefix.

[build]
  command   = "npm ci --prefix server && npm run typecheck --prefix server"
  publish   = "server/public"
  functions = "server/netlify/functions"

[build.environment]
  # 22.6+ is the floor: it runs the TypeScript sources with no build step.
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

  # The site configs are data, not code, so nothing imports them and the
  # bundler would otherwise leave them behind -- and a backend with no tenants
  # answers every request with a 403.
  included_files = ["sites/**"]

[dev]
  port = 8000
