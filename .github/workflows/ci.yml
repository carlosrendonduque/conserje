name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.6 is the floor package.json declares -- it is the first release
        # that runs TypeScript without a build step, which is why the tests
        # need no toolchain. 24 guards against the next LTS breaking that.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Typecheck
        working-directory: server
        run: npm run typecheck

      - name: Unit tests
        working-directory: server
        run: npm test

      - name: Site configs must load
        working-directory: server
        run: |
          node --experimental-strip-types -e "
            import('./src/config/sites.ts').then(({ loadSites }) => {
              const sites = loadSites();
              if (sites.ids().length === 0) throw new Error('no sites loaded');
              console.log('loaded:', sites.ids().join(', '));
            });
          "

  widget:
    name: Widget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        working-directory: widget
        run: node --check src/conserje.js

      - name: Build
        working-directory: widget
        run: node build.mjs

      - name: Bundle must inline the stylesheet
        working-directory: widget
        run: |
          if grep -q '__CONSERJE_STYLES__' dist/conserje.js; then
            echo "The stylesheet placeholder survived the build." >&2
            exit 1
          fi

  n8n:
    name: n8n workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Workflow exports must be valid JSON
        run: |
          for file in n8n/workflows/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$file','utf8'))" \
              || { echo "Invalid JSON: $file" >&2; exit 1; }
            echo "ok $file"
          done

      # The contract test imports the server's signing module directly, so the
      # server's dependencies have to be present for it to resolve.
      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Signature contract (server vs n8n Code node)
        working-directory: n8n
        run: npm test

      - name: Compose file must be valid
        working-directory: n8n
        run: |
          cp .env.example .env
          docker compose config --quiet
